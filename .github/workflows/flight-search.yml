name: Flight Search
on:
  repository_dispatch:
    types: [search-flights]

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Search flights in parallel via SerpAPI
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: python3 scripts/search.py

      - name: Commit results
        run: |
          git config user.name "flight-bot"
          git config user.email "bot@noreply"
          git add results/latest.json
          git commit -m "results $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
