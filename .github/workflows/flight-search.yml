name: Flight Search
on:
  repository_dispatch:
    types: [search-flights]

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Search flights in parallel via SerpAPI
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          TOKEN="ff2026-chianti"
          INPUT_TOKEN=$(echo "$PAYLOAD" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('token',''))")

          if [ "$INPUT_TOKEN" != "$TOKEN" ]; then
            echo '{"error":"Unauthorized"}' > results/latest.json
            exit 0
          fi

          mkdir -p results/tmp

          # Extract searches array and run each in parallel
          echo "$PAYLOAD" | python3 -c "
import json, sys
d = json.load(sys.stdin)
searches = d.get('searches', [])
for s in searches:
    key = s['arrival_id'] + '_' + s.get('return_date', s.get('outbound_date',''))
    print(key + '|' + s['arrival_id'] + '|' + s['outbound_date'] + '|' + s.get('return_date',''))
" | while IFS='|' read -r key arr_id out_date ret_date; do
            (
              url="https://serpapi.com/search?engine=google_flights&departure_id=BER&arrival_id=${arr_id}&outbound_date=${out_date}&return_date=${ret_date}&adults=1&stops=0&currency=EUR&hl=it&api_key=${SERPAPI_KEY}"
              curl -s "$url" > "results/tmp/${key}.json"
              echo "Done: $key"
            ) &
          done
          wait

          # Merge all results into one JSON
          python3 << 'PYEOF'
import json, os, glob

results = {}
for f in glob.glob('results/tmp/*.json'):
    key = os.path.basename(f).replace('.json', '')
    try:
        with open(f) as fh:
            results[key] = json.load(fh)
    except Exception as e:
        results[key] = {"error": str(e)}

with open('results/latest.json', 'w') as out:
    json.dump(results, out)

print(f"Merged {len(results)} results: {list(results.keys())}")
PYEOF

      - name: Commit results
        run: |
          git config user.name "flight-bot"
          git config user.email "bot@noreply"
          git add results/latest.json
          git commit -m "results $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes"
          git push
